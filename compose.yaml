services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
